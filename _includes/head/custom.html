{% if page.url == "/research/" %}
<style>
/* Add a matching divider beneath the Publications heading. */
.page__content h1 {
  padding-bottom: 12px;
  border-bottom: 1px solid #e5e7eb;
  margin-bottom: 24px;
}
  
/* Loaded on this page only; the publication content stays in Markdown. */
.page__content {
  font-size: 17px;
  line-height: 1.6;
}

/* Page heading. */
.page__content h1 {
  margin: 0 0 26px;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.25;
}

/* Paper titles: smaller headings, without the theme's bottom rule. */
.page__content h2 {
  margin: 0 0 8px;
  padding: 0;
  border-bottom: 0;
  font-size: 21px;
  font-weight: 700;
  line-height: 1.35;
}

/* Place a light separator BETWEEN papers instead. */
.page__content ul + h2 {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid #e5e7eb;
}

/* Compact author, venue, and resource-link paragraphs. */
.page__content > p {
  margin: 0 0 6px;
  font-size: 15.5px;
  line-height: 1.5;
  text-indent: 0;
}

/* The paragraph immediately after each title is the author list. */
.page__content h2 + p {
  margin-bottom: 8px;
  color: #626970;
}
.page__content h2 + p strong {
  color: #343a40;
}

/* The next paragraph is the main publication venue. */
.page__content h2 + p + p {
  margin-bottom: 4px;
}
.page__content h2 + p + p strong {
  font-weight: 600;
}

/* Additional workshop line: secondary to the main venue. */
.page__content h2 + p + p + p > strong {
  color: #626970;
  font-size: 15px;
  font-weight: 400;
  font-style: italic;
}

/* Resource links retain the site's existing link color. */
.page__content > p a {
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

/* Summary bullets, including Markdown's paragraph-wrapped lists. */
.page__content > ul {
  margin: 12px 0 0;
  padding-left: 20px;
}
.page__content > ul > li {
  margin: 0;
  padding-left: 2px;
  font-size: 17px;
  line-height: 1.6;
}
.page__content > ul > li + li {
  margin-top: 7px;
}
.page__content li > p {
  margin: 0;
  font-size: inherit;
  line-height: inherit;
}

/* Slightly smaller type on narrow screens. */
@media (max-width: 640px) {
  .page__content h1 { font-size: 27px; }
  .page__content h2 { font-size: 20px; }
  .page__content > p { font-size: 15px; }
  .page__content > ul > li { font-size: 16px; }
  .page__content ul + h2 {
    margin-top: 20px;
    padding-top: 20px;
  }
}
</style>
{% endif %}


<!-- BEGIN Talks & Honors: append once to _includes/head/custom.html -->
{% if page.url == "/talk/" %}
<style>
/* This stylesheet is loaded only for /talk/ by the existing head snippet. */
.page__content {
  font-size: 17px;
  line-height: 1.6;
}

/* Optional page heading, retained in case you add one later. */
.page__content > h1 {
  margin: 0 0 26px;
  padding: 0 0 12px;
  border-bottom: 1px solid #e5e7eb;
  color: #494e52;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.25;
}

/* Main sections: larger and bolder than the paper titles. */
.page__content > h2 {
  margin: 40px 0 18px;
  padding: 0 0 10px;
  border-bottom: 1px solid #e5e7eb;
  color: #494e52;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.3;
}

/* The opening "Talks" heading does not need extra top spacing. */
.page__content > h2:first-of-type {
  margin-top: 0;
}

/* Paper/project titles: smaller, with no extra dividers. */
.page__content > h3 {
  margin: 26px 0 8px;
  padding: 0;
  border: 0;
  color: #343a40;
  font-size: 19.5px;
  font-weight: 600;
  line-height: 1.4;
}

.page__content > h2 + h3 {
  margin-top: 0;
}

/* The lists remain ordinary Markdown; CSS removes the decorative bullets. */
.page__content > ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

.page__content > ul > li {
  margin: 0;
  padding: 0;
  color: #494e52;
  font-size: 16px;
  line-height: 1.6;
}

.page__content > ul > li + li {
  margin-top: 5px;
}

.page__content > ul > li > strong:first-child,
.page__content > ul > li > p > strong:first-child {
  color: #626970;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.page__content li > p {
  margin: 0;
  font-size: inherit;
  line-height: inherit;
}

/* A light, readable awards table with no boxes around individual cells. */
.page__content > table {
  display: table;
  width: 100%;
  margin: 0;
  border: 0;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 15.5px;
  line-height: 1.5;
}

.page__content > table th,
.page__content > table td {
  padding: 9px 14px 9px 0;
  border: 0;
  vertical-align: top;
  text-align: left;
  background: transparent;
}

.page__content > table th {
  padding-top: 0;
  color: #626970;
  font-size: 14px;
  font-weight: 600;
  border-bottom: 1px solid #e5e7eb;
}

.page__content > table tbody tr + tr td {
  border-top: 1px solid #f0f1f2;
}

.page__content > table th:first-child,
.page__content > table td:first-child {
  width: 100px;
  color: #626970;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.page__content > table th:last-child,
.page__content > table td:last-child {
  width: 27%;
  padding-right: 0;
  color: #626970;
}

.page__content a {
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

/* Mobile: preserve the heading hierarchy and stacked awards layout. */
@media (max-width: 600px) {
  .page__content > h1 {
    font-size: 27px;
  }

  .page__content > h2 {
    margin-top: 32px;
    font-size: 24px;
  }

  .page__content > h2:first-of-type {
    margin-top: 0;
  }

  .page__content > h3 {
    font-size: 18px;
    margin-top: 23px;
  }

  .page__content > h2 + h3 {
    margin-top: 0;
  }

  .page__content > ul > li {
    font-size: 15.5px;
  }

  .page__content > table,
  .page__content > table tbody {
    display: block;
    width: 100%;
  }

  /* Keep the column headings available to assistive technology. */
  .page__content > table thead {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .page__content > table tbody tr {
    display: grid;
    grid-template-columns: 80px minmax(0, 1fr);
    gap: 3px 10px;
    padding: 11px 0;
  }

  .page__content > table tbody tr + tr {
    border-top: 1px solid #e5e7eb;
  }

  .page__content > table tbody tr td,
  .page__content > table tbody tr + tr td {
    display: block;
    width: auto;
    padding: 0;
    border: 0;
    min-width: 0;
  }

  .page__content > table tbody tr td:first-child {
    width: auto;
    padding: 0;
    grid-column: 1;
    grid-row: 1 / span 2;
    font-size: 14px;
  }

  .page__content > table tbody tr td:nth-child(2) {
    grid-column: 2;
    grid-row: 1;
  }

  .page__content > table tbody tr td:last-child {
    width: auto;
    padding: 0;
    grid-column: 2;
    grid-row: 2;
    font-size: 14px;
  }
}
</style>
{% endif %}
<!-- END Talks & Honors -->
